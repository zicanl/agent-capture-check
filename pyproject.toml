[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-capture-check"
version = "0.1.0"
description = "Test whether agent runs preserve the execution data you may need later."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zican Li" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-capture-check = "agent_capture_check.cli:main"

[project.entry-points.pytest11]
agent_capture_check = "agent_capture_check.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_capture_check"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
